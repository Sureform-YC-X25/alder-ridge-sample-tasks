name: Sample package CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --project environment --frozen
      - run: uv run --project environment python environment/validate.py
      - run: uv run --project environment python -c "import runtime.env, runtime.tasks; assert len(runtime.tasks.tasks) == 12"
